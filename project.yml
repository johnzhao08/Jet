# Xcode project definition. Regenerate Jet.xcodeproj with `xcodegen generate`.
# `Jet` is the iPad app that ships through App Store Connect; `JetMac` is the Mac app, built and
# signed locally (./run-mac.sh, ./install-mac.sh).
name: Jet
options:
  bundleIdPrefix: com.johnzhao
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  JetKit:
    path: JetKit
targets:
  Jet:
    type: application
    platform: iOS
    sources:
      - App
      - Resources
    dependencies:
      - package: JetKit
        product: JetKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnzhao.jet
        PRODUCT_NAME: Jet
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: BJ2UZLM855
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Jet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Sync uses only standard HTTPS, which is exempt from export-compliance paperwork.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Vaults live in the app's Documents folder and show up in the Files app.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Document types (PDFs, pictures, text…) for "Open in Jet"; merged into the generated Info.plist.
        INFOPLIST_FILE: Config/Jet-Info.plist

  JetMac:
    type: application
    platform: macOS
    sources:
      - App
      - Resources
    dependencies:
      - package: JetKit
        product: JetKit
      - target: JetMCP
        link: false
    postBuildScripts:
      # The MCP helper ships inside the app (Contents/MacOS/jet-mcp), next to Jet itself.
      - name: Embed jet-mcp
        script: cp -f "$BUILT_PRODUCTS_DIR/jet-mcp" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/jet-mcp"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/jet-mcp
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/jet-mcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnzhao.jet.mac
        PRODUCT_NAME: Jet
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Mac
        INFOPLIST_KEY_CFBundleDisplayName: Jet
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Document types, so Finder can open files with Jet; merged into the generated Info.plist.
        INFOPLIST_FILE: Config/JetMac-Info.plist
        # Signed for this Mac only ("Sign to Run Locally"); no certificate or notarization needed.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        # Not sandboxed: vaults can be any folder, and the AI helper is launched by other apps.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

  JetMCP:
    type: tool
    platform: macOS
    sources:
      - Tools/jet-mcp
    dependencies:
      - package: JetKit
        product: JetKit
    settings:
      base:
        PRODUCT_NAME: jet-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.johnzhao.jet.mcp
        SWIFT_VERSION: "5.0"
        # PencilKit wants a bundle identifier, which a bare executable gets from an embedded Info.plist.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  JetMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: JetMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "5.0"

  JetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Jet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"

schemes:
  JetMac:
    build:
      targets:
        JetMac: all
    test:
      targets: [JetMacUITests]
  Jet:
    build:
      targets:
        Jet: all
    test:
      targets: [JetUITests]
